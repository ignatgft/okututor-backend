spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/okututor_test
    username: okututor
    password: okututor
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: false
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025

app:
  cors:
    allowed-origins: http://localhost:5173
  frontend-url: http://localhost:5173
  jwt:
    secret: test-secret-do-not-use-in-production-0123456789abcdef
    access-ttl-minutes: 15
    refresh-ttl-days: 30
    refresh-grace-seconds: 30
  livekit:
    api-key: devkey
    api-secret: devsecret-change-me-012345678901234
    ws-url: wss://localhost:7880
    token-ttl-minutes: 30
  mail:
    enabled: false
  rate-limit:
    enabled: false
  seed:
    enabled: false
  storage:
    local-dir: ./data/uploads
    public-base-url: /api/v1/files
